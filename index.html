
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizHub - Test Your Knowledge</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">QuizHub</a>
            <span class="navbar-text">Learn. Play. Grow.</span>
        </div>
    </nav>

    <!-- Main Section -->
    <main class="container py-5">

        <section class="text-center mb-5">
            <h1>Welcome to QuizHub!</h1>
            <p>Challenge yourself with quizzes from different domains.</p>
        </section>

        <!-- Quiz Setup -->
        <section class="quiz-box mx-auto">

            <h2 class="text-center mb-4">Choose Your Quiz</h2>

            <label for="category" class="form-label">Select a Category</label>
            <select id="category" class="form-select mb-3">
                <option value="">Choose a category</option>
                <option value="technology">Technology & Programming</option>
                <option value="science">Science</option>
                <option value="math">Mathematics & Aptitude</option>
                <option value="engineering">Engineering</option>
                <option value="english">English & Communication</option>
                <option value="gk">General Knowledge</option>
                <option value="sports">Sports</option>
                <option value="entertainment">Entertainment</option>
                <option value="business">Business & Finance</option>
                <option value="nature">Nature & Environment</option>
            </select>

            <label for="difficulty" class="form-label">Select Difficulty</label>
            <select id="difficulty" class="form-select mb-4">
                <option value="easy">Easy</option>
                <option value="medium">Medium</option>
                <option value="hard">Hard</option>
            </select>

            <button id="start-btn" class="btn btn-primary w-100">
                Start Quiz
            </button>

        </section>

        <!-- Quiz Questions -->
        <section id="quiz-section" class="quiz-box mx-auto mt-4" hidden>

            <div class="d-flex justify-content-between mb-3">
                <span id="question-count">Question 1</span>
                <span id="score">Score: 0</span>
            </div>

            <div class="progress mb-4">
                <div id="progress-bar"
                     class="progress-bar"
                     role="progressbar"
                     style="width: 0%">
                </div>
            </div>

            <h3 id="question-text">Question appears here</h3>

            <div id="options" class="my-4"></div>

            <p id="feedback" aria-live="polite"></p>

            <button id="next-btn" class="btn btn-primary w-100" hidden>
                Next Question
            </button>

        </section>

        <!-- Results -->
        <section id="result-section" class="quiz-box mx-auto mt-4 text-center" hidden>
            <h2>Quiz Completed!</h2>
            <p id="final-score"></p>
            <p id="result-message"></p>

            <button id="retry-btn" class="btn btn-primary">
                Try Again
            </button>

            <button id="home-btn" class="btn btn-outline-secondary">
                Choose Another Quiz
            </button>
        </section>

    </main>

    <!-- Footer -->
    <footer class="text-center py-3">
        <p>&copy; 2026 QuizHub | Test Your Knowledge</p>
    </footer>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JavaScript -->
    <script src="script.js"></script>

</body>
</html>
